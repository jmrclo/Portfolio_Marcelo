    // Multi-Provider Live LLM Call Function
    async function executeLiveLlm(provider, apiKey, model, userQuery, messageHistory) {
      if (provider === 'gemini') {
        const gemModel = model || 'gemini-1.5-flash';
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${gemModel}:generateContent?key=${apiKey}`;
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: LLM_SYSTEM_PROMPT }] },
            contents: messageHistory.map(m => ({
              role: m.sender === 'user' ? 'user' : 'model',
              parts: [{ text: m.text }]
            }))
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error?.message || `Gemini API returned status ${res.status}`);
        return data.candidates?.[0]?.content?.parts?.[0]?.text;
      }

      if (provider === 'openai') {
        const oaModel = model || 'gpt-4o-mini';
        const url = 'https://api.openai.com/v1/chat/completions';
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
          body: JSON.stringify({
            model: oaModel,
            messages: [
              { role: 'system', content: LLM_SYSTEM_PROMPT },
              ...messageHistory.map(m => ({ role: m.sender === 'user' ? 'user' : 'assistant', content: m.text }))
            ]
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error?.message || `OpenAI API returned status ${res.status}`);
        return data.choices?.[0]?.message?.content;
      }

      if (provider === 'groq') {
        const groqModel = model || 'llama-3.3-70b-versatile';
        const url = 'https://api.groq.com/openai/v1/chat/completions';
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
          body: JSON.stringify({
            model: groqModel,
            messages: [
              { role: 'system', content: LLM_SYSTEM_PROMPT },
              ...messageHistory.map(m => ({ role: m.sender === 'user' ? 'user' : 'assistant', content: m.text }))
            ]
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error?.message || `Groq API returned status ${res.status}`);
        return data.choices?.[0]?.message?.content;
      }

      if (provider === 'ollama') {
        const url = 'http://localhost:11434/api/chat';
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: model || 'llama3',
            messages: [
              { role: 'system', content: LLM_SYSTEM_PROMPT },
              ...messageHistory.map(m => ({ role: m.sender === 'user' ? 'user' : 'assistant', content: m.text }))
            ],
            stream: false
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error("Could not reach Ollama at localhost:11434");
        return data.message?.content;
      }

      throw new Error(`Unsupported LLM provider: ${provider}`);
    }
